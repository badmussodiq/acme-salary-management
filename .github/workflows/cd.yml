name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Build, scan and push ${{ matrix.app }}
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - name: Image name
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${owner}/acme-salary-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: scan:${{ matrix.app }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: Scan for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:${{ matrix.app }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.app }}

  deploy-api:
    name: Deploy the API to Render
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "RENDER_DEPLOY_HOOK_URL is not set" >&2; exit 1; }
          curl --fail --silent --show-error --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered"

  smoke:
    name: Post-deploy smoke check
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - name: Wait for the API to report ready
        run: |
          test -n "$API_URL" || { echo "Repository variable API_URL is not set" >&2; exit 1; }
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 20 "${API_URL%/}/api/v1/health/ready" | grep -q '"ok"'; then
              echo "API ready after $attempt attempt(s)"; exit 0
            fi
            sleep 15
          done
          echo "API did not become ready" >&2; exit 1
      - name: Check the web app
        run: |
          test -n "$WEB_URL" || { echo "Repository variable WEB_URL is not set" >&2; exit 1; }
          curl --fail --silent --show-error --max-time 60 --retry 5 --retry-delay 10 --retry-all-errors "${WEB_URL%/}/healthz" > /dev/null
          echo "Web app is up"
