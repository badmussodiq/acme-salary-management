services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acme -d acme']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
