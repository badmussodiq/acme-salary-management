# Local infrastructure: PostgreSQL, an S3-compatible store (RustFS) and a mail catcher (Mailpit).
name: acme-infra

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acme -d acme']
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: acme-dev
      RUSTFS_SECRET_KEY: acme-dev-secret-key
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
    ports:
      - '9000:9000'
    volumes:
      - rustfs-data:/data

  # Catches every outgoing email. Inbox UI on http://localhost:8025, SMTP on 1025.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  postgres-data:
  rustfs-data:
