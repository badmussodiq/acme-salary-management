name: acme-salary

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: acme
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acme -d acme']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:-${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/acme-salary-api:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://acme:${POSTGRES_PASSWORD}@postgres:5432/acme
      WEB_ORIGIN: https://${DOMAIN:?DOMAIN must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      INITIAL_HR_EMAIL: ${INITIAL_HR_EMAIL:?INITIAL_HR_EMAIL must be set}
      INITIAL_HR_PASSWORD: ${INITIAL_HR_PASSWORD:?INITIAL_HR_PASSWORD must be set}
      TRUST_PROXY_HOPS: '1'
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: 'true'

  web:
    image: ${WEB_IMAGE:-${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/acme-salary-web:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: 'true'

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  updater:
    image: nickfedor/watchtower:1.24.1
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_POLL_INTERVAL: ${UPDATE_INTERVAL_SECONDS:-60}
      REPO_USER: ${REGISTRY_USER:-}
      REPO_PASS: ${REGISTRY_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
